name: Validation
on:
  push:
    branches:
      - feature/bugz-azure-aks
    paths:
      - 'files/playground-main/projects/feature/bugz-azure-aks/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build
        run: |
          dotnet restore files/playground-main/projects/feature/bugz-azure-aks/src/Bugz.Api
          dotnet build --configuration Release files/playground-main/projects/feature/bugz-azure-aks/src/Bugz.Api

      - name: Build Docker image
        run: |
          docker build -t validation-bugz -f files/playground-main/projects/feature/bugz-azure-aks/docker/Dockerfile files/playground-main/projects/feature/bugz-azure-aks

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Validate Bicep build
        run: |
          az bicep version || az bicep install
          az bicep build --file files/playground-main/projects/feature/bugz-azure-aks/infra/main.bicep
