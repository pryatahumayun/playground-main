name: Bugz Azure AKS Infra

on:
  push:
    branches:
      - main
    paths:
      - 'projects/bugz-azure-aks/infra/**'
      - '.github/workflows/bugz-azure-aks-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: bugz-azure-aks-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: projects/bugz-azure-aks
  PROJECT_NAME: bugz
  ENVIRONMENT: dev
  LOCATION: eastus
  RESOURCE_GROUP: bugz-dev-rg
  AKS_SKU: Standard_D2s_v7
  NODE_COUNT: 1

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --name "bugz-infra-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --parameters "$PROJECT_PATH/infra/main.bicepparam" \
            projectName="$PROJECT_NAME" \
            environment="$ENVIRONMENT" \
            location="$LOCATION" \
            aksSku="$AKS_SKU" \
            nodeCount="$NODE_COUNT" \
            --output none

      - name: Show outputs
        run: |
          az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name "bugz-infra-${GITHUB_RUN_NUMBER}" \
            --query properties.outputs
