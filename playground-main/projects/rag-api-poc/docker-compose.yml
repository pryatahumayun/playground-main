services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: us-east-1
      EMBEDDING_PROVIDER: mock
      GENERATION_PROVIDER: mock
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
