apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugz-api
  namespace: bugz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bugz-api
  template:
    metadata:
      labels:
        app: bugz-api
    spec:
      containers:
        - name: bugz-api
          image: example.azurecr.io/bugz-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PET_NAME
              value: "Bugz"
            - name: CLOUD_PROVIDER
              value: "Azure"
            - name: PLATFORM
              value: "AKS"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
